<div class="home-container flex flex-col w-full h-full px-6 py-4 gap-6">
  <div
    [class]="
      events.length === 0
        ? 'flex flex-col card-container gap-4 justify-start'
        : 'grid grid-cols-3 card-container gap-4 justify-start'
    "
  >
    @for (event of events; track event.id) {
    <app-event-card [event]="event"></app-event-card>
    } @if (eventsLoading) {
    <app-event-card [loading]="true"></app-event-card>
    } @else if (!events || events.length === 0) {
    <div class="flex flex-col items-center justify-center gap-4">
      <h2 class="text-xl font-medium">No hay eventos</h2>
      <p>Crea un evento para que aparezca aquí</p>
      <button class="btn btn-primary cursor-pointer">
        <a routerLink="/create" class="text-decoration-none">Crear evento</a>
      </button>
    </div>
    }
  </div>
</div>
